name = "2025-izdrail-com"
main = "dist/_worker.js/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Astro Cloudflare adapter expects env.ASSETS. Workers Assets replaces legacy KV Sites.
[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true

# Bind the D1 database
[[d1_databases]]
binding = "DB"
database_name = "chats"
database_id = "2150eff8-e9a7-4986-b790-a731438b7a2a"